<!-- Permanent P53 template: one transmission with its real route context. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#25152b">
    <meta name="description" content="@@P53_DESCRIPTION@@">@@SHARING_META@@
    <link rel="icon" href="../covers/GSI_favicon.svg" type="image/svg+xml">
    <link rel="preload" href="../fonts/SpaceGrotesk-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <script>
    (() => {
        try {
            const param = (new URLSearchParams(window.location.search)).get("theme");
            const stored = localStorage.getItem("gsi-theme");
            const choice = param || stored || "dark";
            const mode = (choice === "light") ? "light" : "dark";
            document.documentElement.dataset.gsiTheme = mode;
        } catch {}
    })();
    </script>
    <script src="../scripts/theme-mode.js" defer></script>
    <link rel="stylesheet" href="../styles/gsi-tokens.css">
    <link rel="stylesheet" href="../styles/art-room.css">
    <link rel="stylesheet" href="../styles/p53-transmission.css">
    <link rel="stylesheet" href="../styles/p53-transmission-vars.css">
    <link rel="stylesheet" href="../styles/story-studio.css">
    <link rel="stylesheet" href="../styles/heart-feedback.css">
    <link rel="stylesheet" href="../styles/theme-mode.css">
    <title>@@P53_TITLE@@</title>
</head>
<body class="art-room p53-transmission-room" style="@@ART_STYLE@@">
    <a class="skip-link" href="#main-content">Skip to transmission</a>
    <main class="p53-page" id="main-content">
        <header class="p53-nav">
            <nav class="p53-trace floating-path" aria-label="P53 path">
                <a id="p53-trace-archive" href="../index.html" aria-label="Chaperone home" title="Chaperone"><span class="gsi-home-mark" data-gsi-mark="favicon-slot"><span class="gsi-home-mark-icon" aria-hidden="true"><img src="../covers/GSI_favicon.svg" alt="" width="19" height="19" loading="eager" decoding="async"></span></span></a><span class="trace-separator" aria-hidden="true">→</span>
                <a id="p53-trace-filter" class="hidden" href="../index.html"></a><span id="p53-trace-filter-separator" class="trace-separator hidden" aria-hidden="true">→</span>
                <a id="p53-trace-artist" class="hidden" href="../index.html"></a><span id="p53-trace-artist-separator" class="trace-separator hidden" aria-hidden="true">→</span>
                <a id="p53-radio-index" href="index.html">RADIO P53</a>
            </nav>
        </header>
        <section class="transmission">
            <div class="p53-corner-actions">
                <button class="share-transmission" id="share-transmission" type="button" aria-haspopup="dialog">Share</button>
                <button class="heart-trigger heart-trigger--p53" id="heart-trigger" type="button" aria-pressed="false" aria-label="Heart @@TRACK@@">
                    <span class="heart-pulse-ring" aria-hidden="true"></span>
                    <svg class="heart-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <defs>
                            <linearGradient id="gsi-heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="var(--art-primary, var(--accent, #ff65ad))"/>
                                <stop offset="52%" stop-color="var(--art-glow, var(--art-control, #ff8bc2))"/>
                                <stop offset="100%" stop-color="var(--art-secondary, #35c9e9)"/>
                            </linearGradient>
                            <linearGradient id="gsi-heart-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
                                <stop offset="50%" stop-color="rgba(255,255,255,0.68)"/>
                                <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                            </linearGradient>
                            <clipPath id="gsi-heart-clip">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </clipPath>
                        </defs>
                        <path class="heart-outline-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        <path class="heart-fill-path" fill="url(#gsi-heart-grad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        <g clip-path="url(#gsi-heart-clip)">
                            <rect class="heart-shimmer-path" x="-6" y="0" width="14" height="24" fill="url(#gsi-heart-sheen)" transform="skewX(-18)"/>
                        </g>
                    </svg>
                </button>
            </div>
            <div class="protein-panel"><img src="../covers/P53_cover-runtime.webp" alt="Expressive P53 protein artwork" width="900" height="900" loading="eager" decoding="async"></div>
            <div class="signal-panel">
                @@COVER_HTML@@
                <h1 dir="auto">@@TRACK@@</h1>
                <p class="artist" dir="auto">@@ARTIST@@</p>
                <p class="album" dir="auto">@@ALBUM@@</p>
                @@NOTE_HTML@@
                @@STREAMING_LINKS_HTML@@
            </div>
        </section>
        <div class="p53-details">
            <aside class="p53-about"><h2>Why P53?</h2><p>@@ABOUT_TEXT@@</p></aside>
            @@ENTRY_COUNTERPART_HTML@@
        </div>
    </main>
    <dialog id="story-modal" class="story-modal story-studio-modal" aria-labelledby="story-modal-title">
        <div class="story-modal-shell">
            <header class="story-modal-header">
                <div class="story-modal-heading">
                    <h2 id="story-modal-title" class="story-modal-title">Share Card</h2>
                </div>
                <button type="button" class="story-modal-close" id="story-modal-close" aria-label="Close share card">✕</button>
            </header>
            <div class="story-modal-body">
                <div class="story-studio-preview-col">
                    <div class="story-card-preview-wrap">
                        <canvas id="story-card-canvas" role="img" width="1080" height="1920" class="story-card-canvas" aria-label="Chaperone 9:16 share card preview"></canvas>
                    </div>
                </div>
                <div class="story-studio-controls-col">
                    <div class="story-control-group">
                        <span class="story-control-label">BACKGROUND</span>
                        <div class="story-mode-toggle" role="group" aria-label="Card background style">
                            <button type="button" class="story-mode-btn" id="story-style-paper" data-p53-style="paper" aria-pressed="true">LIT</button>
                            <button type="button" class="story-mode-btn" id="story-style-dark" data-p53-style="dark" aria-pressed="false">DIM</button>
                        </div>
                    </div>
                    <div class="story-control-group story-sliders-group">
                        <label class="story-slider-field" for="story-gradient-slider">
                            <span class="story-slider-header">
                                <span class="story-control-label">GRADIENT</span>
                                <span class="story-slider-value" id="story-gradient-value">65%</span>
                            </span>
                            <input type="range" id="story-gradient-slider" class="story-range-input" min="0" max="100" step="5" value="65">
                        </label>
                        <label class="story-slider-field" for="story-cover-slider">
                            <span class="story-slider-header">
                                <span class="story-control-label">COVER SIZE</span>
                                <span class="story-slider-value" id="story-cover-value">80%</span>
                            </span>
                            <input type="range" id="story-cover-slider" class="story-range-input" min="60" max="100" step="2" value="80">
                        </label>
                    </div>
                    <div class="story-control-group">
                        <span class="story-control-label">QUOTE</span>
                        <div class="story-quote-chips" id="story-quote-chips"></div>
                        <textarea id="story-quote-input" class="story-quote-textarea" rows="3" maxlength="320" placeholder="Custom quote (leave blank for none)…"></textarea>
                    </div>
                    <div class="story-control-group">
                        <button type="button" class="story-watermark-toggle" id="story-watermark-toggle" role="switch" aria-checked="true">
                            <span class="story-watermark-copy">
                                <span class="story-control-label">WATERMARK</span>
                                <span class="story-watermark-sample">view now in Chaperone!</span>
                            </span>
                            <span class="story-switch-track" aria-hidden="true"><span class="story-switch-thumb"></span></span>
                        </button>
                    </div>
                    <div class="story-modal-actions">
                        <button type="button" class="story-btn story-btn-share" id="story-btn-share" disabled>Share card ↗</button>
                        <button type="button" class="story-btn story-btn-copy-image" id="story-btn-copy-image" disabled>Copy image</button>
                        <button type="button" class="story-btn story-btn-download" id="story-btn-download" disabled>Download card</button>
                        <button type="button" class="story-btn story-btn-copy" id="story-btn-copy">Copy link</button>
                        <p class="story-status" id="story-status" role="status" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </div>
    </dialog>
    <script id="p53-transmission-context" type="application/json">@@P53_CONTEXT_JSON@@</script>
    <script src="../scripts/gsi-context.js"></script>
    <script src="../scripts/p53-transmission.js"></script>
    <script type="module" src="../scripts/heart-feedback.js"></script>
</body>
</html>
