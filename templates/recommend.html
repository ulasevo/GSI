<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="description" content="Recommend a signal for Chaperone.">
  <title>Time for YOU to take the wheel · Chaperone</title>
  <link rel="icon" href="covers/GSI_favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/SpaceGrotesk-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
  <script>
    (() => {
        try {
            const param = (new URLSearchParams(window.location.search)).get("theme");
            const stored = localStorage.getItem("gsi-theme");
            const choice = param || stored || "dark";
            const mode = (choice === "light") ? "light" : "dark";
            document.documentElement.dataset.gsiTheme = mode;
        } catch {}
    })();
    </script>
    <script src="scripts/theme-mode.js?v=20260921-persist" defer></script>
  <link rel="stylesheet" href="styles/gsi-tokens.css">
  <link rel="stylesheet" href="styles/recommend.css?v=20260920-final7">
  <link rel="stylesheet" href="styles/theme-mode.css?v=20260920-final8">
</head>
<body class="recommend-room">
  <a class="skip-link" href="#main-content">Skip to recommendation form</a>
  <main class="recommend-shell" id="main-content">
    <nav class="recommend-path floating-path" aria-label="Chaperone path"><a href="index.html" aria-label="Chaperone home" title="Chaperone"><span class="gsi-home-mark" data-gsi-mark="favicon-slot"><span class="gsi-home-mark-icon" aria-hidden="true"><img src="covers/GSI_favicon.svg" alt="" width="19" height="19" loading="eager" decoding="async"></span></span></a></nav>
    <div class="recommend-main-grid">
      <header class="recommend-header">
        <h1>Time for YOU to take the wheel</h1>
        <p>Send a song, album or a playlist that carries a piece of you. Note that I will be able to see what you write here, but it won't be public unless you request it to be.</p>
      </header>
      <form id="recommend-form" class="recommend-form" novalidate>
        <label>Link <span>your favorite provider</span><input id="recommend-link" name="link" type="url" maxlength="2000" required placeholder="https://music.apple.com/..." autocomplete="url"></label>
        <label>Notes <span>describe the feeling, the reason, any details that come with what you have shared</span><textarea id="recommend-note" name="note" maxlength="4000" required rows="7" placeholder="I have been listening to this song since the september of '22 and it just..."></textarea></label>
        <label>Signature <span>username, optional</span><input id="recommend-name" name="name" type="text" maxlength="80" placeholder="ulaş" autocomplete="nickname"></label>
        <div class="recommend-actions"><button type="submit">SEND THE SIGNAL ↗</button><a href="index.html">RETURN TO CHAPERONE</a></div>
        <p id="recommend-status" class="recommend-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="scripts/gsi-context.js"></script>
  <script src="scripts/recommend.js"></script>
</body>
</html>
