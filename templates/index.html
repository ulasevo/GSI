<!-- Homepage template: Python supplies cards and filter data; scripts add state. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="@@SAFE_META_DESCRIPTION@@">
    <meta name="theme-color" content="#0d0d0f">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GSI">
    <meta property="og:title" content="@@SAFE_PAGE_TITLE@@">
    <meta property="og:description" content="@@SAFE_META_DESCRIPTION@@">@@HOMEPAGE_URL_META@@@@SHARE_IMAGE_META@@
    <link rel="icon" href="covers/GSI_favicon.svg" type="image/svg+xml">
    <script src="scripts/theme-mode.js?v=20260921-persist"></script>
    <link rel="stylesheet" href="styles/gsi-tokens.css">
    <link rel="stylesheet" href="styles/gsi-home.css">
    <link rel="stylesheet" href="styles/theme-mode.css?v=20260920-final8">
    <title>@@SAFE_PROJECT_TITLE@@</title>
</head>
<body data-view="wall">
    <div class="signal-transform" aria-hidden="true"></div>
    <header class="site-hero">
        <div class="hero-copy">
            <div class="hero-architecture" aria-hidden="true">
                <span>GENOME</span><span>STABILITY</span><span>INDUCERS</span>
            </div>
            <div class="wordmark">GSI</div>
            @@INTRO_HTML@@
        </div>
        @@P53_HTML@@
    </header>
    @@FILTERS_HTML@@
    <div class="layout-format-controls">
      <div class="view-control" role="group" aria-label="Layout">
        <button class="view-cycle-btn" id="view-cycle-btn" type="button" data-current-view="wall" aria-label="Cycle layout view (current: WALL)">
            <span class="view-cycle-icon" aria-hidden="true">
                <svg class="icon-wall" width="13" height="13" viewBox="0 0 14 14" fill="currentColor">
                    <rect x="1" y="1" width="5" height="5" rx="1"/>
                    <rect x="8" y="1" width="5" height="5" rx="1"/>
                    <rect x="1" y="8" width="5" height="5" rx="1"/>
                    <rect x="8" y="8" width="5" height="5" rx="1"/>
                </svg>
                <svg class="icon-poster" width="13" height="13" viewBox="0 0 14 14" fill="currentColor">
                    <rect x="2.5" y="1" width="9" height="12" rx="1.5"/>
                </svg>
                <svg class="icon-gallery" width="13" height="13" viewBox="0 0 14 14" fill="currentColor">
                    <rect x="1" y="1" width="3" height="3" rx="0.5"/>
                    <rect x="5.5" y="1" width="3" height="3" rx="0.5"/>
                    <rect x="10" y="1" width="3" height="3" rx="0.5"/>
                    <rect x="1" y="5.5" width="3" height="3" rx="0.5"/>
                    <rect x="5.5" y="5.5" width="3" height="3" rx="0.5"/>
                    <rect x="10" y="5.5" width="3" height="3" rx="0.5"/>
                    <rect x="1" y="10" width="3" height="3" rx="0.5"/>
                    <rect x="5.5" y="10" width="3" height="3" rx="0.5"/>
                    <rect x="10" y="10" width="3" height="3" rx="0.5"/>
                </svg>
            </span>
            <span class="view-cycle-label">VIEW</span>
            <strong class="view-cycle-value" id="view-cycle-value">WALL</strong>
            <span class="view-cycle-arrow" aria-hidden="true">⟳</span>
        </button>
        <button class="view-btn" data-view="poster" aria-pressed="false" hidden>Poster</button>
        <button class="view-btn active" data-view="wall" aria-pressed="true" hidden>Wall</button>
        <button class="view-btn" data-view="gallery" aria-pressed="false" hidden>Gallery</button>
      </div>
      <div class="format-control" role="group" aria-label="Format">
        <button class="format-cycle-btn" id="format-cycle-btn" type="button" data-current-format="songs" aria-label="Cycle archive format (current: SONGS)">
            <span class="format-cycle-icon" aria-hidden="true">
                <svg class="icon-songs" width="13" height="13" viewBox="0 0 14 14" fill="currentColor">
                    <rect x="2" y="2.5" width="10" height="1.8" rx="0.9"/>
                    <rect x="2" y="6.1" width="7.5" height="1.8" rx="0.9"/>
                    <rect x="2" y="9.7" width="9.5" height="1.8" rx="0.9"/>
                </svg>
                <svg class="icon-albums" width="13" height="13" viewBox="0 0 14 14" fill="none">
                    <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
                    <circle cx="7" cy="7" r="2.2" stroke="currentColor" stroke-width="1"/>
                    <circle cx="7" cy="7" r="0.9" fill="currentColor"/>
                </svg>
            </span>
            <span class="format-cycle-label">FORMAT</span>
            <strong class="format-cycle-value" id="format-cycle-value">SONGS</strong>
            <span class="format-cycle-arrow" aria-hidden="true">⟳</span>
        </button>
        <button class="format-option" data-format-option="songs" type="button" aria-pressed="true" hidden>SONGS</button>
        <button class="format-option" data-format-option="albums" type="button" aria-pressed="false" hidden>ALBUMS</button>
        <button class="format-option" data-format-option="artists" type="button" aria-pressed="false" disabled aria-disabled="true" hidden>ARTISTS</button>
      </div>
      <a class="recommend-link" href="recommend.html"><span class="recommend-label">RECOMMEND</span><span class="recommend-words">A SIGNAL</span><span class="recommend-arrow">↗</span></a>
    </div>
    <div class="grid">
        @@CARDS_HTML@@
    </div>
<script src="scripts/gsi-context.js"></script>
<script id="gsi-filter-data" type="application/json">@@FILTER_DATA_JSON@@</script>
<script src="scripts/home-state.js"></script>
<script src="scripts/home-layout.js"></script>
<script src="scripts/home-format.js"></script>
<script src="scripts/home-filters.js"></script>
<script src="scripts/home-page.js"></script>
</body>
</html>
