<!-- Homepage template: Python supplies cards and filter data; scripts add state. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="@@SAFE_META_DESCRIPTION@@">
    <meta name="theme-color" content="#0d0d0f">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Chaperone">
    <meta property="og:title" content="@@SAFE_PAGE_TITLE@@">
    <meta property="og:description" content="@@SAFE_META_DESCRIPTION@@">@@HOMEPAGE_URL_META@@@@SHARE_IMAGE_META@@
    <link rel="icon" href="covers/GSI_favicon.svg" type="image/svg+xml">
    <script>
    (() => {
        try {
            const param = (new URLSearchParams(window.location.search)).get("theme");
            const stored = localStorage.getItem("gsi-theme");
            const choice = param || stored || "dark";
            const mode = (choice === "light") ? "light" : "dark";
            document.documentElement.dataset.gsiTheme = mode;
        } catch {}
    })();
    </script>
    <script src="scripts/theme-mode.js?v=20260921-persist"></script>
    <link rel="stylesheet" href="styles/gsi-tokens.css">
    <link rel="stylesheet" href="styles/gsi-home.css">
    <link rel="stylesheet" href="styles/theme-mode.css?v=20260920-final8">
    <title>@@SAFE_PAGE_TITLE@@</title>
</head>
<body data-view="wall" data-format="songs">
    <div class="signal-transform" aria-hidden="true"></div>
    <header class="site-hero">
        <div class="site-masthead">
            <div class="site-branding">
                <h1 class="wordmark">@@SAFE_PROJECT_TITLE@@</h1>
                @@INTRO_HTML@@
            </div>
            <div class="header-actions">
                <a class="recommend-link" href="recommend.html" title="Recommend a song"><span class="recommend-text">Recommend</span><span class="recommend-arrow" aria-hidden="true">↗</span></a>
                <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to LIT mode">
                    <span class="theme-toggle__track" aria-hidden="true"><span class="theme-toggle__icon"></span></span>
                    <span class="theme-toggle__label">DIM</span>
                </button>
            </div>
        </div>
        @@P53_HTML@@
    </header>
    @@FILTERS_HTML@@
    <div class="layout-format-controls">
      <div class="segmented-control view-segmented" role="group" aria-label="Layout density">
        <button class="view-btn" data-view="poster" type="button" aria-pressed="false" aria-label="Poster view (zoomed in)" title="Poster view">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2.5" y="1" width="9" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <rect x="4.5" y="9.5" width="5" height="1" rx="0.5" fill="currentColor"/>
          </svg>
        </button>
        <button class="view-btn active" data-view="wall" type="button" aria-pressed="true" aria-label="Wall view (default)" title="Wall view">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="4.5" height="3.5" rx="0.5" fill="currentColor"/>
            <rect x="1.5" y="5.8" width="3.5" height="0.8" rx="0.4" fill="currentColor"/>
            <rect x="8" y="1.5" width="4.5" height="3.5" rx="0.5" fill="currentColor"/>
            <rect x="8" y="5.8" width="3.5" height="0.8" rx="0.4" fill="currentColor"/>
            <rect x="1.5" y="7.8" width="4.5" height="3.5" rx="0.5" fill="currentColor"/>
            <rect x="1.5" y="12.1" width="3.5" height="0.8" rx="0.4" fill="currentColor"/>
            <rect x="8" y="7.8" width="4.5" height="3.5" rx="0.5" fill="currentColor"/>
            <rect x="8" y="12.1" width="3.5" height="0.8" rx="0.4" fill="currentColor"/>
          </svg>
        </button>
        <button class="view-btn" data-view="gallery" type="button" aria-pressed="false" aria-label="Gallery view (zoomed out)" title="Gallery view">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="5.5" y="1.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="9.5" y="1.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="1.5" y="5.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="5.5" y="5.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="9.5" y="5.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="1.5" y="9.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="5.5" y="9.5" width="3" height="3" rx="0.5" fill="currentColor"/>
            <rect x="9.5" y="9.5" width="3" height="3" rx="0.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="segmented-control format-segmented" role="group" aria-label="Format">
        <button class="format-option active" data-format-option="songs" type="button" aria-pressed="true">Songs</button>
        <button class="format-option" data-format-option="albums" type="button" aria-pressed="false">Albums</button>
      </div>
    </div>
    <div class="grid">
        @@CARDS_HTML@@
    </div>
<script src="scripts/gsi-context.js"></script>
<script id="gsi-filter-data" type="application/json">@@FILTER_DATA_JSON@@</script>
<script src="scripts/home-state.js"></script>
<script src="scripts/home-layout.js"></script>
<script src="scripts/home-format.js"></script>
<script src="scripts/home-filters.js"></script>
<script src="scripts/home-page.js"></script>
</body>
</html>
