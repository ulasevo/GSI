name: Deploy GSI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the archive
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install builder dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and build GSI
        run: |
          python -m py_compile build.py
          python -m json.tool config.json > /dev/null
          python build.py --site-only --validate-links
          test ! -d site/tools
          test -f site/404.html
          python -B -m unittest discover -s tests
          node tests/test_browser_contract.js
          node tests/test_p53_card_render.js
          node tests/test_p53_share.js
          python -B tools/overnight_audit.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
